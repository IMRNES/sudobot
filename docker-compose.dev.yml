# Development services.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# The ports are offset from the defaults so this can run alongside another
# PostgreSQL on the same machine without a conflict.

services:
  postgres:
    image: postgres:18-alpine
    container_name: sudobot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sudobot
      # Deterministic collation, so an index behaves the same in development and in
      # production rather than depending on the host's locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - sudobot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sudobot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional. The dashboard's OAuth flow stores pending states in process memory,
  # which is correct for one replica; a second one needs a shared store, and this is
  # where it would go.
  redis:
    image: redis:7-alpine
    container_name: sudobot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sudobot-postgres:
