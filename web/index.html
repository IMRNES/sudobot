<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<meta name="description" content="Dashboard for the sudobot Discord bot." />
		<title>sudobot</title>
		<script>
			// Dark-first: keep the document in sync with the stored preference before
			// first paint so there is no flash of the wrong palette.
			try {
				const stored = localStorage.getItem("sudobot.theme")
				if (stored === "light") document.documentElement.classList.replace("dark", "light")
			} catch {
				/* storage can be unavailable; the dark default still applies */
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
