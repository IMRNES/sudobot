# Serves the built SPA.
#
# Two rules matter, and both exist because this is a client-side router:
#
#   1. Any path that is not a file goes to index.html, so a deep link like
#      /dashboard/123/settings works on a cold load instead of 404ing.
#   2. Anything under /api is proxied to the gateway, so the browser sees one
#      origin and cookies are same-site. Without this the API would need CORS and
#      a cookie policy that survives third-party-cookie blocking.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints everything under /assets, so those are safe to cache
    # forever. index.html is not fingerprinted and must never be cached, or a
    # deploy leaves clients loading an old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The API, on the same origin. `gateway` is the compose service name.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: unknown paths render the app, which decides what to do.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
