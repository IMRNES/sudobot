name: Build & Deploy

# Build in CI, ship the artifacts. The host has no Rust toolchain and never gets
# one: a release is four executables and a static dashboard, not 700 MB of
# `target/` rebuilt on a box that is also running other people's services.
#
# CI is the gate — `cargo fmt`, `clippy -D warnings`, the unit suite, and the
# migrations applied and rolled back against a real Postgres — and it runs on
# every push and PR. The deploy job only runs for `main`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded PR run, but never a push to main: the deploy job inside it
# may be mid-cutover, and cancelling that leaves the host between two releases.
# Pushes to main are serialised by the deploy job's own `sudobot-deploy` group
# instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}

jobs:
  # The gate. `ci.yml` is called rather than copied: the check a deploy depends on
  # and the check a PR shows are then the same file, so they cannot drift.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  web-artifact:
    name: Build dashboard
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `VITE_API_BASE_URL` is deliberately EMPTY for this build: the dashboard and
      # the API are served from one origin, so relative requests are correct and
      # CORS does not exist in production. Setting it to an absolute origin here
      # would be the bug, not the fix.
      - name: Build
        run: pnpm --filter web build
        env:
          VITE_API_BASE_URL: ""

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The release build. Runs only on main: a PR gets the gate, not binaries.
  # ---------------------------------------------------------------------------
  build:
    name: Build release payload
    needs: [ci, web-artifact]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # A separate cache namespace from the CI job: the CI job builds test
          # targets, this one builds release artifacts, and sharing a key makes
          # each job evict the other's work.
          key: release

      - name: Build the binaries
        run: |
          cargo build --release --locked \
            --bin gateway --bin bot --bin migrate --bin bootstrap

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: payload/web

      # The payload is asserted before it is packed, so a build that silently
      # produced fewer than four executables fails here rather than on the host
      # with the old release already stopped.
      - name: Assemble and audit the payload
        run: |
          set -euo pipefail
          mkdir -p payload
          for bin in gateway bot migrate bootstrap; do
            test -x "target/release/$bin" || { echo "::error::$bin was not built"; exit 1; }
            cp "target/release/$bin" "payload/$bin"
          done

          # Declare which commit these binaries are. The host keeps the payload in
          # a shared directory, so a concurrent manual deploy can refill it; the
          # deploy script refuses a payload whose declared SHA is not the one it is
          # deploying, which turns a mislabelled release into a stopped deploy.
          echo "${{ github.sha }}" > payload/RELEASE_SHA

          test -f payload/web/index.html || { echo "::error::the dashboard build is missing index.html"; exit 1; }

          echo "--- payload ---"
          ls -lh payload
          du -sh payload

          # Every shared library the runner has must exist on the target too. The
          # runner's glibc is older than prod's, which is the safe direction, but
          # this catches a crate that pulled in a library prod does not have.
          echo "--- dynamic deps ---"
          for bin in gateway bot migrate bootstrap; do
            echo "$bin:"; ldd "payload/$bin" | sed 's/^/  /'
          done

      # A tar, not a directory of artifacts. `upload-artifact` does not preserve
      # the executable bit, so a plain upload arrives on the host with four
      # non-executable files and the deploy refuses them — a failure that only
      # shows up after the transfer. A tar carries the mode.
      - name: Pack the payload
        run: tar -czf sudobot-payload.tar.gz -C payload .

      - uses: actions/upload-artifact@v7
        with:
          name: sudobot-payload
          path: sudobot-payload.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to imrnes
    needs: build
    runs-on: ubuntu-latest

    # Serialise deploys and never cancel one half-applied. This is the job-level
    # group, distinct from the workflow-level one above.
    concurrency:
      group: sudobot-deploy
      cancel-in-progress: false

    # `github.ref`, NOT `event_name`: a manual `workflow_dispatch` runs this file
    # from the dispatched ref and still receives the repository secrets, so an
    # event-based gate would let a dispatch aimed at a branch deploy that branch
    # over production.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sudobot-payload
          # Keyed by SHA, not a fixed name. A concurrent deploy — CI's, or an
          # operator's manual one — would otherwise `rm -rf` and refill the same
          # directory, and whichever wrote last would decide what gets installed
          # under the *other* commit's label.
          path: /tmp/sudobot-payload-${{ github.sha }}

      - name: Unpack the payload
        env:
          STAGING: /tmp/sudobot-payload-${{ github.sha }}
        run: |
          set -euo pipefail
          tar -xzf "$STAGING/sudobot-payload.tar.gz" -C "$STAGING"
          rm -f "$STAGING/sudobot-payload.tar.gz"
          ls -lh "$STAGING"
          du -sh "$STAGING"

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 || { echo "::error::SSH key invalid"; exit 1; }
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the payload
        env:
          STAGING: /tmp/sudobot-payload-${{ github.sha }}
          REMOTE_STAGING: /tmp/sudobot-payload-${{ github.sha }}
        run: |
          set -euo pipefail
          # The remote staging directory is removed before the copy so a rerun of
          # this same SHA cannot leave a stale binary behind. It is per-SHA, so it
          # cannot disturb a deploy running for a different commit.
          ssh "$VPS_USER@$VPS_HOST" "rm -rf $REMOTE_STAGING /tmp/sudobot-systemd-${{ github.sha }} && mkdir -p $REMOTE_STAGING /tmp/sudobot-systemd-${{ github.sha }}"

          # `-r` and the trailing `/.` on the source: the payload directory holds
          # both files and the `web/` subdirectory, and a single recursive copy is
          # the whole transfer. Copying `.../*` first and then `web` separately
          # looks equivalent but is not — the glob already matched
          # `/tmp/sudobot-payload/web`, so the second scp finds a directory where
          # it wanted a regular file and fails.
          scp -qr "$STAGING/." "$VPS_USER@$VPS_HOST:$REMOTE_STAGING/"

          scp -q systemd/sudobot-gateway.service systemd/sudobot-bot.service systemd/sudobot.caddy \
            "$VPS_USER@$VPS_HOST:/tmp/sudobot-systemd-${{ github.sha }}/"

      - name: Deploy
        env:
          REMOTE_STAGING: /tmp/sudobot-payload-${{ github.sha }}
        # The script runs ON the host and is SCP'd from THIS checkout, never from
        # the live release: running it from /opt/sudobot/current would be a
        # chicken-and-egg trap where a fix to the deploy script can never take
        # effect, because the copy that would apply it is itself the stale one.
        run: |
          # The script is named per SHA too: a shared `/tmp/deploy-sudobot.sh`
          # means a deploy can execute a script written by a different run, so the
          # fix you shipped is not the code that runs.
          scp -q scripts/deploy-direct.sh "$VPS_USER@$VPS_HOST:/tmp/deploy-sudobot-${{ github.sha }}.sh"
          ssh "$VPS_USER@$VPS_HOST" \
            "sed -i 's/\r$//' /tmp/deploy-sudobot-${{ github.sha }}.sh && \
             sudo ARTIFACT_DIR=$REMOTE_STAGING SYSTEMD_SRC=/tmp/sudobot-systemd-${{ github.sha }} \
               bash /tmp/deploy-sudobot-${{ github.sha }}.sh '${{ github.sha }}'"

      - name: Verify
        run: |
          ssh "$VPS_USER@$VPS_HOST" '\
            echo "--- units ---"; \
            for u in sudobot-gateway sudobot-bot; do \
              printf "  %-18s %s\n" "$u" "$(systemctl is-active $u 2>/dev/null || echo inactive)"; \
            done; \
            echo "--- release ---"; \
            readlink -f /opt/sudobot/current; \
            du -sh /opt/sudobot/releases/* 2>/dev/null; \
            echo "--- http ---"; \
            for url in \
              http://127.0.0.1:8080/api/v1/iam/health \
              https://sudobot.imrnes.team/api/v1/iam/health \
              https://sudobot.imrnes.team/ ; do \
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo ERR); \
              printf "  %-46s %s\n" "$url" "$code"; \
            done; \
            echo "--- bot ---"; \
            journalctl -u sudobot-bot --since "5 min ago" --no-pager 2>/dev/null | grep -E "connected to discord|level ladder provisioned|reconciled" | tail -5'